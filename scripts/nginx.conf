server {
    listen 80;
    server_name nodecraft.yourdomain.com.br;

    root /var/www/nodecraft;
    index index.html;

    # React Router — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the manager (optional — if frontend and API share a domain)
    location /api/ {
        proxy_pass http://localhost:9183/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        client_max_body_size 5000m;      # allow up to 5GB
        proxy_read_timeout 600s;         # time waiting for the upstream to respond
        proxy_send_timeout 600s;         # time to send the request to upstream
        proxy_request_buffering off;     # stream body directly to upstream instead of buffering to disk first
    }

    location /worker/ {
        proxy_pass http://localhost:9184/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 7500m;
        proxy_read_timeout 3600s;         # time waiting for the upstream to respond
        proxy_send_timeout 3600s;         # time to send the request to upstream
        proxy_request_buffering off;
    }
}